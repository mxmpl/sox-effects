name: Release workflow
permissions: {}

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yml
    # The called jobs can't get more than what is granted here: this is the union of what they request.
    permissions:
      security-events: write # Upload zizmor's SARIF report
      artifact-metadata: write # Create the artifact storage record
      attestations: write # Write the build provenance to the repository attestation store
      id-token: write # Sigstore signing of the provenance

  publish-to-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: publish-to-pypi
    permissions:
      id-token: write # Needed for trusted publishing, and to sign the attestations
    steps:
      - name: Download all dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "latest"
          enable-cache: false

      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Upload to PyPI
        run: uv publish --trusted-publishing always

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish-to-pypi # Only tag a release once it is actually on PyPI.
    permissions:
      contents: write # Create GitHub release
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all dists
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: ./dist/

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag ./dist/*
