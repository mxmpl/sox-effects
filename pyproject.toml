[project]
name = "sox-effects"
description = "Minimal libsox effects bindings for any array"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Maxime Poli" }]
keywords = ["audio", "bindings", "sox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Scientific/Engineering",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Issues = "https://github.com/mxmpl/sox-effects/issues"
Repository = "https://github.com/mxmpl/sox-effects"

[dependency-groups]
test = [
  "jax>=0.12.0",
  "numpy>=2.2.6",
  "pytest>=9.2.0",
  "torch>=2.10",
]

[build-system]
requires = ["nanobind>=3.1.0", "scikit-build-core>=1.1.1", "setuptools-scm>=10.3.4"]
build-backend = "scikit_build_core.build"

[tool.cibuildwheel]
build = "cp312-*"  # abi3: a single wheel per platform covers Python >= 3.12
skip = "*-musllinux_*"
test-command = "python -c \"import sox_effects; assert sox_effects.effect_names()\""

[tool.cibuildwheel.linux]
# sox.h for the build (sox-devel is in PowerTools on manylinux_2_28, CRB on manylinux_2_34), libsox for the test.
before-all = "dnf install -y 'dnf-command(config-manager)' && (dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled crb) && dnf install -y sox-devel"

[tool.cibuildwheel.macos]
before-all = "brew install sox"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.ruff]
line-length = 119

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"

[tool.setuptools_scm]

[tool.typos.default.extend-words]
writeable = "writeable"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/sox_effects/sox_effects.cpp" },
  { git = { commit = true, tags = true } },
]
